<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#0a2540"/>
  <!-- grid -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0091b9" stroke-width="0.3" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- pixel squares deco -->
  <rect x="30" y="30" width="12" height="12" fill="#0091b9" opacity="0.6"/>
  <rect x="50" y="30" width="8" height="8" fill="#f5c518" opacity="0.5"/>
  <rect x="740" y="400" width="10" height="10" fill="#ff6500" opacity="0.6"/>
  <rect x="760" y="385" width="6" height="6" fill="#0091b9" opacity="0.4"/>

  <!-- house icon pixel art -->
  <rect x="352" y="160" width="96" height="8" fill="#0091b9"/>
  <rect x="360" y="152" width="80" height="8" fill="#0091b9"/>
  <rect x="368" y="144" width="64" height="8" fill="#0091b9"/>
  <rect x="376" y="136" width="48" height="8" fill="#0091b9"/>
  <rect x="384" y="128" width="32" height="8" fill="#f5c518"/>
  <rect x="352" y="168" width="96" height="72" fill="#0d3259"/>
  <rect x="354" y="170" width="92" height="68" fill="#0a2d50"/>
  <!-- door -->
  <rect x="384" y="200" width="32" height="40" fill="#0091b9" opacity="0.8"/>
  <!-- windows -->
  <rect x="360" y="182" width="20" height="16" fill="#f5c518" opacity="0.7"/>
  <rect x="420" y="182" width="20" height="16" fill="#f5c518" opacity="0.7"/>

  <!-- title -->
  <text x="400" y="290" font-family="monospace" font-size="32" font-weight="bold" fill="#bae4f0" text-anchor="middle" letter-spacing="4">NIMBUSLY</text>
  <text x="400" y="318" font-family="monospace" font-size="13" fill="#0091b9" text-anchor="middle" letter-spacing="2">HOME MANAGEMENT APP</text>

  <!-- WIP badge -->
  <rect x="340" y="336" width="120" height="28" fill="#ff6500"/>
  <text x="400" y="355" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">IN PROGRESS</text>

  <!-- tech tags -->
  <text x="400" y="410" font-family="monospace" font-size="11" fill="#0091b9" text-anchor="middle" opacity="0.7">Next.js · Supabase · PostgreSQL · Tailwind</text>
</svg>
