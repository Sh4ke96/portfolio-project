<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#0a2540"/>
  <!-- grid -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0091b9" stroke-width="0.3" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- pixel deco -->
  <rect x="28" y="400" width="10" height="10" fill="#0091b9" opacity="0.5"/>
  <rect x="760" y="30" width="12" height="12" fill="#f5c518" opacity="0.5"/>
  <rect x="44" y="38" width="8" height="8" fill="#ff6500" opacity="0.4"/>

  <!-- pixel cross / health icon -->
  <rect x="380" y="128" width="40" height="104" fill="#0091b9" opacity="0.9"/>
  <rect x="348" y="160" width="104" height="40" fill="#0091b9" opacity="0.9"/>
  <!-- inner lighter cross -->
  <rect x="388" y="136" width="24" height="88" fill="#bae4f0" opacity="0.25"/>
  <rect x="356" y="168" width="88" height="24" fill="#bae4f0" opacity="0.25"/>
  <!-- center dot -->
  <rect x="392" y="172" width="16" height="16" fill="#f5c518"/>

  <!-- title -->
  <text x="400" y="290" font-family="monospace" font-size="32" font-weight="bold" fill="#bae4f0" text-anchor="middle" letter-spacing="4">ZORIVA</text>
  <text x="400" y="318" font-family="monospace" font-size="13" fill="#0091b9" text-anchor="middle" letter-spacing="2">HEALTH MANAGEMENT PLATFORM</text>

  <!-- WIP badge -->
  <rect x="340" y="336" width="120" height="28" fill="#ff6500"/>
  <text x="400" y="355" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">IN PROGRESS</text>

  <!-- tech tags -->
  <text x="400" y="410" font-family="monospace" font-size="11" fill="#0091b9" text-anchor="middle" opacity="0.7">Next.js · Supabase · PostgreSQL · Cypress · next-intl</text>
</svg>
